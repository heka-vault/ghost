[package]
name = "ghost-voice"
description = "Ghost's own voice pipeline: typed frames over bounded channels, speech in and out, the conversation runtime, the latency timeline and the replay harness (ADR 0039, W7)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "ghost-perf"
path = "src/bin/ghost-perf.rs"

[dependencies]
ghost-core.workspace = true
ghost-llm.workspace = true
ghost-audio.workspace = true
ghost-infer.workspace = true
ghost-api.workspace = true

anyhow.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
futures.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
uuid.workspace = true
regex.workspace = true
rand.workspace = true
zeroize.workspace = true
base64.workspace = true
hound.workspace = true
sha1.workspace = true
hex.workspace = true
indexmap.workspace = true
# The replay harness: an isolated Ghost per run.
tempfile.workspace = true

[dev-dependencies]
ghost-core = { workspace = true, features = ["fakes"] }
