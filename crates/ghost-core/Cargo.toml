[package]
name = "ghost-core"
description = "Ghost's core: the write gate, the permissions, the audit, the agents and the apps (ADR 0007, 0011, 0034, 0035)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

# The two MCP servers Ghost ships as apps (ADR 0034): the names apps.json names.
[[bin]]
name = "ghost-mock-github"
path = "src/bin/ghost-mock-github.rs"

[[bin]]
name = "ghost-scripts"
path = "src/bin/ghost-scripts.rs"

[features]
# An issue-like write model for the gate's tests, in this crate and in others.
fakes = []

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
