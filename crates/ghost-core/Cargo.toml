[package]
name = "ghost-core"
description = "Ghost's core: the write gate, the permissions, the audit, the agents and the apps (ADR 0007, 0011, 0034, 0035)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
# An issue-like write model for the gate's tests, in this crate and in others.
fakes = []

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
chrono.workspace = true
uuid.workspace = true
rusqlite.workspace = true
zeroize.workspace = true
subtle.workspace = true
regex.workspace = true
sha2.workspace = true
toml.workspace = true
async-trait.workspace = true
futures.workspace = true
tokio.workspace = true
unicode-normalization.workspace = true
indexmap.workspace = true
reqwest.workspace = true
url.workspace = true
rmcp = { workspace = true, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest", "auth"] }

[dev-dependencies]
tempfile.workspace = true
wiremock.workspace = true
axum.workspace = true
# A fake app in process for the tests: rmcp's server side over a duplex pipe and over HTTP.
rmcp = { workspace = true, features = ["server", "transport-streamable-http-server"] }
