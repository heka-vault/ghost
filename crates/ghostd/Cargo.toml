[package]
name = "ghostd"
description = "Ghost's daemon: wake, sessions, apps, the control API, the phone and hooks listeners"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "ghostd"
path = "src/main.rs"

[dependencies]
ghost-api.workspace = true
ghost-core.workspace = true
ghost-llm.workspace = true
# restore-volumes: the ducked volumes a crash left (crates/ghost-audio, ADR 0038); the desk's
# devices and the passive capture (W7).
ghost-audio.workspace = true
# The voice pipeline, the models and the wake detectors (W7), the phone's media (W8).
ghost-voice.workspace = true
ghost-infer.workspace = true
ghost-rtc.workspace = true

serde_json.workspace = true
indexmap.workspace = true
# `ghostd push` (a signed delivery to the hooks listener) and the listeners' tests.
reqwest.workspace = true
uuid.workspace = true

anyhow.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
axum.workspace = true
serde.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
zeroize.workspace = true
subtle.workspace = true
regex.workspace = true
sha2.workspace = true
hmac.workspace = true
hex.workspace = true
base64.workspace = true
rand.workspace = true
percent-encoding.workspace = true
async-trait.workspace = true
nix.workspace = true
# termios: `ghostd passwords set` reads the value from the terminal without echo.
# process: `run` stops when the shell that started it is gone (ADR 0038).
rustix = { workspace = true, features = ["termios", "process"] }

[dev-dependencies]
tempfile.workspace = true
# A paused clock for the passive listener's idle test.
tokio = { workspace = true, features = ["test-util"] }
tower.workspace = true
ghost-core = { workspace = true, features = ["fakes"] }
