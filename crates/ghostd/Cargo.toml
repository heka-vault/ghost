[package]
name = "ghostd"
description = "Ghost's daemon: wake, sessions, apps, the control API, the phone and hooks listeners"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "ghostd"
path = "src/main.rs"

[dependencies]
ghost-api.workspace = true
ghost-core.workspace = true
ghost-llm.workspace = true

serde_json.workspace = true

anyhow.workspace = true
thiserror.workspace = true
tokio.workspace = true
axum.workspace = true
serde.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
zeroize.workspace = true
subtle.workspace = true
regex.workspace = true
sha2.workspace = true
hmac.workspace = true
hex.workspace = true
base64.workspace = true
rand.workspace = true
percent-encoding.workspace = true
async-trait.workspace = true
nix.workspace = true
# termios: `ghostd passwords set` reads the value from the terminal without echo.
# process: `run` stops when the shell that started it is gone (ADR 0038).
rustix = { workspace = true, features = ["termios", "process"] }

[dev-dependencies]
tempfile.workspace = true
tower.workspace = true
