# Echo-cancelled microphone for Ghost.
# Capture: the webcam mic. Reference: what the speakers are playing (their monitor).
# Produces source "ghost.mic". Does not create a virtual sink, so apps keep
# playing to the real output and per-stream ducking still works.
context.modules = [
  { name = libpipewire-module-echo-cancel
    args = {
      library.name = aec/libspa-aec-webrtc
      aec.args = {
        webrtc.gain_control = true
        webrtc.extended_filter = true
        webrtc.noise_suppression = true
        webrtc.voice_detection = false
      }
      monitor.mode = true
      capture.props = {
        node.name = ghost.mic.capture
        node.target = "alsa_input.usb-046d_HD_Webcam_C615_B7DC4310-00.mono-fallback"
        node.passive = true
        audio.channels = 1
        audio.position = [ MONO ]
      }
      source.props = {
        node.name = ghost.mic
        node.description = "Ghost mic (echo cancelled)"
        audio.channels = 1
        audio.position = [ MONO ]
      }
      playback.props = {
        node.name = ghost.ref.capture
        node.target = "alsa_output.pci-0000_00_1f.3.analog-stereo"
        stream.capture.sink = true
        node.passive = true
      }
    }
  }
]
