# Ghost autonomy policy (ADR 0011, ADR 0024). Copied to ~/.config/ghost/policy.toml by `make env`.
#
# For each of Ghost's own write operations, how much Ghost may do on its own:
#   deny      not offered to the model at all
#   confirm   Ghost asks first and waits for your spoken yes (or your plain request is the yes)
#   announce  Ghost does it, then says so in a few words
#   quiet     Ghost does it and only mentions it if asked, or if it failed
#
# Anything you leave out falls back to the operation's declared risk: low announces, medium
# and high confirm. Resolution order: target rule > source rule > [defaults] > risk.
#
# Servers are not here any more. Each department's folder under ~/.config/ghost (Ghost's is
# the folder itself) has an mcp.json with its servers and a department.json with their
# writes and levels; see infra/example and docs/departments.md.
#
# Ghost never writes this file, and nothing a server returns can change it.
# Every write is logged; to reverse one, ask Ghost for the opposite change.

[defaults]
# autonomy = "confirm"        # uncomment to make everything ask unless listed below

[conversations]               # the agents (hire, retire, rename, persona, notes, ...)
# set_persona = "confirm"
# delete = "confirm"

[skills]                      # Ghost's own skills folder
# add = "confirm"
# remove = "confirm"

[departments]                 # a rule appended to a department's AGENTS.md, its memory
# add_rule = "confirm"
