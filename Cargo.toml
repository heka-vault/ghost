# The Rust workspace: the daemon's crates under crates/ and the desktop app's Tauri shell
# (ADR 0039). One lock file; `cargo build --workspace` builds both binaries the bundle ships.
[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "2026.10.0"
edition = "2024"
license = "MIT"
authors = ["Eric Polerecky"]
rust-version = "1.98"

[workspace.dependencies]
ghost-api = { path = "crates/ghost-api" }
ghost-core = { path = "crates/ghost-core" }

anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "io-util", "fs", "process"] }
axum = { version = "0.8", features = ["json", "ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.41", features = ["bundled"] }
zeroize = { version = "1", features = ["derive"] }
subtle = "2"
regex = "1"
sha2 = "0.10"
sha1 = "0.10"
percent-encoding = "2"
hmac = "0.12"
hex = "0.4"
toml = { version = "0.8", features = ["preserve_order"] }
async-trait = "0.1"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "blocking"] }
wiremock = "0.6"
unicode-normalization = "0.1"
yaml-rust2 = { version = "0.13", default-features = false }
tempfile = "3"
aes-gcm = "0.11"
base64 = "0.22"
rustix = { version = "1", features = ["fs"] }
secret-service = { version = "5", features = ["rt-tokio-crypto-rust"] }
rmcp = { version = "3", default-features = false, features = ["server", "macros", "transport-io"] }
schemars = "1"
rand = "0.9"
url = "2"

[profile.release]
debug = 1 # line tables, so a panic in the journal has a location
lto = "thin"
codegen-units = 4
