# A one-off bench of speech-to-text engines on the operator's recorded Hearing session
# (docs/benchmarks/2026-11-15-stt-engines.md). Its own workspace: not a member of the
# repo's, not built by CI. Scores with Ghost's own scorer by path dependency.
[package]
name = "stt-engines"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
ghost-voice = { path = "../../../../crates/ghost-voice" }
ghost-infer = { path = "../../../../crates/ghost-infer" }
transcribe-cpp = { version = "=0.4.2", default-features = false, features = ["serde", "vulkan"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[profile.release]
debug = false
