# The root of the Python that is left (ADR 0039): the daemon is Rust (`Cargo.toml`, `crates/`).
# This file is the one source of Ghost's version (`tools/version.py` writes every copy from
# it, docs/releasing.md), the ruff settings for every Python file in the repository, and the
# uv workspace of the tools. The oracle (`tools/oracle`, the model wrappers the Rust daemon
# is measured against) has its own lock and is not a member.
[project]
name = "ghost"
version = "2026.10.0"
description = "Ghost: a voice-first assistant that triages GitHub issues on one Linux workstation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["tools"]
exclude = ["tools/oracle"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[tool.pytest.ini_options]
testpaths = ["tools/tests"]

[tool.ruff]
extend-exclude = ["docs/benchmarks/scripts"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
