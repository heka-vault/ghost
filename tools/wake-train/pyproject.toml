# Retraining the "hey ghost" detector on the operator's own kept wake takes (ADR 0065):
# a small head on the frozen openWakeWord features (`melspectrogram.onnx`,
# `embedding_model.onnx`), trained on this machine's CPU with numpy and exported as a
# `hey_ghost.onnx` the daemon loads unchanged. Its own lock, outside the root workspace:
# `make wake-train`, or `uv run --project tools/wake-train python -I -m wake_train`.
[project]
name = "ghost-wake-train"
version = "2026.10.0"
description = "Retrain the hey ghost detector on the operator's own wake takes, on this machine"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "numpy>=1.26",
    # The runtime Ghost ships (ADR 0039), and the graph library voice-trial pins.
    "onnxruntime==1.24.4",
    "onnx==1.19.1",
    "soxr>=0.5",
    # Synthetic voices: the Kokoro Ghost speaks with, as the oracle pins it.
    "kokoro-onnx==0.6.1",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wake_train"]
