[project]
name = "ghostd"
version = "0.1.0"
description = "Desktop daemon: wake word, music ducking, pipeline lifecycle"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ghost-voice",
    "ghost-core",
    "ghost-api",
    "pulsectl>=24.12",
    "sounddevice>=0.5",
    "numpy>=1.26",
    "pydantic-settings>=2.5",
    "loguru>=0.7",
]

[project.scripts]
ghostd = "ghostd.main:cli"

[tool.uv.sources]
ghost-voice = { workspace = true }
ghost-core = { workspace = true }
ghost-api = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ghostd"]
