<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Ghost · README desktop</title>
    <!--
      A made-up desktop for the README's pictures of the floating room (scripts/floating-shots.mjs):
      a wallpaper, an editor, a terminal and a browser, every word and pixel synthetic (world.ts and
      world.css, shared with the site's hero). The real floating page (floating.html with the mock
      daemon) is laid over it in a transparent iframe, as the floating surface is laid over a real
      desktop. Development only: not built.

      ?float=<query for floating.html>   e.g. ?float=mock%3Dfloating-tour%26placement%3Dcorner
    -->
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #020308; }
      /* Ghost, laid over everything */
      iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: transparent; z-index: 5; }
    </style>
  </head>
  <body>
    <div class="world" id="world"></div>

    <iframe id="ghost" title="Ghost" allowtransparency="true"></iframe>

    <script type="module">
      import "@fontsource-variable/inter/opsz.css";
      import "@fontsource-variable/jetbrains-mono";
      import "./world.css";
      import { mountWorld } from "./world.ts";

      // Ghost: the real floating page with the mock daemon, over the desktop.
      const q = new URLSearchParams(location.search).get("float") ?? "mock=floating-tour";
      document.getElementById("ghost").src = `/floating.html?${q}`;
      mountWorld(document.getElementById("world"));
    </script>
  </body>
</html>
