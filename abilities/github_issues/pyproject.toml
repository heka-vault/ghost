[project]
name = "ghost-github-issues"
version = "0.1.0"
description = "Ghost ability: triage GitHub issues by voice (labels, comments, state)"
requires-python = ">=3.12,<3.13"
dependencies = ["ghost-core", "pydantic>=2.9", "pydantic-settings>=2.5", "httpx>=0.27"]

[project.entry-points."ghost.abilities"]
github_issues = "ghost_github_issues:ability"

[tool.uv.sources]
ghost-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ghost_github_issues"]
