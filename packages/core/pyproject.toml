[project]
name = "ghost-core"
version = "2026.10.0"
description = "Ghost core: the write gate, policy, audit, lines and MCP servers"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "loguru>=0.7",
    "mcp>=1.2",
    "pyyaml>=6",
    "cryptography>=44",
    "secretstorage>=3.3",
]

[project.scripts]
ghost-mock-github = "ghost_core.mock_github:main"
ghost-scripts = "ghost_core.scripts_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ghost_core"]
