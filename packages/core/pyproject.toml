[project]
name = "ghost-core"
version = "0.1.0"
description = "Ghost core: the ability API, the write gate, policy, audit"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.9", "pydantic-settings>=2.5", "httpx>=0.27", "loguru>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ghost_core"]
