[project]
name = "ghost-skills"
version = "0.1.0"
description = "Skill interface and the github_issues skill"
requires-python = ">=3.12,<3.13"
dependencies = ["ghost-domain", "pydantic>=2.9", "httpx>=0.27"]

[tool.uv.sources]
ghost-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ghost_skills"]
