[project]
name = "ghost-domain"
version = "0.1.0"
description = "The write gate: proposals, spoken confirmation, execution, readback, audit"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ghost_domain"]
