[project]
name = "ghost-api"
version = "0.1.0"
description = "Ghost control API: FastAPI on a Unix socket, the contract the desktop and mobile apps use"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ghost-core",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=13",
    "httpx>=0.27",
    "pydantic>=2.9",
    "loguru>=0.7",
]

[tool.uv.sources]
ghost-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ghost_api"]
