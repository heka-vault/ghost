name: ci
on:
  push:
    branches: [main]
  pull_request:
  # The merge queue tests what will land: queued pull requests together, on top of main.
  merge_group:

permissions:
  contents: read

# A new push to a PR replaces its run; runs on main always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The Python that is left (ADR 0039): the tools under tools/ and the scripts. ruff over
  # every Python file in the repository, pytest over the tools' tests (the version script,
  # scripts/deploy.sh). The oracle (tools/oracle) is not synced here: its lock is read by
  # the version test, and its model libraries are for the workstation.
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run --project tools pytest -q -p no:cacheprovider

  typescript:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: generated client is current
        run: pnpm gen:check
      - run: pnpm typecheck
      - run: pnpm test
      - name: desktop frontend builds
        run: pnpm build

  # The Rust workspace: the daemon's crates and the Tauri shell (ADR 0039). Clippy is
  # strict, every test runs, cargo-deny fails on a known vulnerability or a license outside
  # deny.toml's allowlist, and the control API's document is checked against the Rust types.
  # One dev build serves clippy, the tests and the export. The release build and the
  # packages are the `bundle` job's, beside this one and only when packaging could change.
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev clang libclang-dev lld \
            libpipewire-0.3-dev libspa-0.2-dev libpulse-dev libasound2-dev \
            libespeak-ng-dev libopus-dev
      # Only main saves the cache: a pull request restores main's and adds nothing to the
      # repository's 10 GB, which pull requests' own copies were filling.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@nextest
      - run: cargo fmt --all --check
      # generate_context! wants the frontend's folder to exist; its contents don't matter to a check.
      - run: mkdir -p apps/desktop/dist
      - run: cargo clippy --workspace --locked --all-targets -- -D warnings
      # ONNX Runtime 1.24.4 and the four small model files into the cache (W10 of #39):
      # `ort` loads the library at run time, so every test that opens a session needs it
      # there, and the daemon the parent-death tests start reads Silero from the cache
      # (`ghost_infer::models`). The bundle below carries the same files.
      - run: scripts/onnxruntime.sh
      - run: scripts/models.sh
      - run: cargo nextest run --workspace --locked
      # The contract the TypeScript client is generated from is the Rust types' document.
      - name: openapi.json is current
        run: cargo run -q -p ghost-api --bin ghost-api-export --locked | diff -u packages/api/openapi.json -
      - uses: EmbarkStudios/cargo-deny-action@v2
        with: { command: check }

  # Which files a pull request touches, for the bundle below. The list is the build
  # process and nothing else: the two workflows, the shell's packaging (its config, build
  # script, manifest, removal script, icons, capabilities), the scripts and tools that stage
  # and describe the bundle, and the workspace manifest (the release profile, the members).
  # Ordinary source, a crate's own manifest and the lock files are not on it: the tests'
  # build proves those compile. Of the 45 pull requests merged before this one, 9 touched
  # the list. If the bundle starts running on most pull requests, narrow this list.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      packaging: ${{ steps.filter.outputs.packaging }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            packaging:
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'
              - 'apps/desktop/src-tauri/tauri*.conf.json'
              - 'apps/desktop/src-tauri/build.rs'
              - 'apps/desktop/src-tauri/Cargo.toml'
              - 'apps/desktop/src-tauri/prerm'
              - 'apps/desktop/src-tauri/icons/**'
              - 'apps/desktop/src-tauri/capabilities/**'
              - 'scripts/sidecars.sh'
              - 'scripts/onnxruntime.sh'
              - 'scripts/models.sh'
              - 'scripts/posthog-cli.sh'
              - 'tools/report_chunks.py'
              - 'tools/release_manifest.py'
              - 'Cargo.toml'
              - 'package.json'

  # The bundle (ADR 0038): the daemon and the app's binaries in release, packaged with what
  # they need. It runs on every push to main, and for a pull request (and its turn in the
  # merge queue) only when it touches the build process (the list above): a change to ordinary code
  # is proven by the tests, by main's run after it lands, and by the release workflow before
  # anything ships. A pull request builds the .deb alone; main builds the AppImage too. The
  # release profile is the same everywhere, so main's cache of the dependencies serves all.
  bundle:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.packaging == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BUNDLES: ${{ github.event_name == 'push' && 'deb,appimage' || 'deb' }}
    steps:
      - uses: actions/checkout@v4
      - name: system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev clang libclang-dev lld \
            libpipewire-0.3-dev libspa-0.2-dev libpulse-dev libasound2-dev \
            libespeak-ng-dev libopus-dev
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: scripts/onnxruntime.sh
      - run: scripts/models.sh
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: the bundle
        run: pnpm tauri build --ci --bundles "$BUNDLES"
      - name: the bundle carries the daemon, the app binaries, ONNX Runtime, the model files and its record
        run: |
          ls -la target/release/bundle/deb/*.deb
          case "$BUNDLES" in *appimage*) ls -la target/release/bundle/appimage/*.AppImage ;; esac
          for b in ghostd ghost-mock-github ghost-scripts heka-ghost-desktop; do
            dpkg-deb -c target/release/bundle/deb/*.deb | grep -q "usr/bin/$b\$" || { echo "missing: $b"; exit 1; }
          done
          for f in onnxruntime/libonnxruntime.so.1.24.4 onnxruntime/LICENSE \
                   models/silero_vad.onnx models/smart-turn-v3.2-cpu.onnx \
                   models/melspectrogram.onnx models/embedding_model.onnx \
                   models/LICENSE.silero-vad models/LICENSE.smart-turn models/LICENSE.openwakeword \
                   ghost-build.json; do
            dpkg-deb -c target/release/bundle/deb/*.deb | grep -q "usr/lib/heka-ghost-desktop/$f\$" \
              || { echo "missing: $f"; exit 1; }
          done
          # The record names this commit (ghostd::build_info reads it; docs/releasing.md).
          # Tauri's bundler stores members as usr/..., dpkg's as ./usr/...; match either.
          dpkg-deb --fsys-tarfile target/release/bundle/deb/*.deb \
            | tar -xO --wildcards '*/heka-ghost-desktop/ghost-build.json' \
            | tee /dev/stderr | grep -qF "\"commit\": \"$(git rev-parse HEAD)\""

  # The one check main's ruleset requires, so adding or renaming a job above needs no
  # settings change.
  ci-ok:
    if: always()
    needs: [python, typescript, rust, changes, bundle]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: every job passed
        run: |
          # The bundle may be skipped (a change that touches no packaging); nothing else may.
          echo '${{ toJSON(needs) }}' | jq -e 'to_entries | all(.value.result == "success" or (.key == "bundle" and .value.result == "skipped"))'
