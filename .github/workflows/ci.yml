name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a PR replaces its run; runs on main always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The Python that is left (ADR 0039): the tools under tools/ and the scripts. ruff over
  # every Python file in the repository, pytest over the tools' tests (the version script,
  # scripts/deploy.sh). The oracle (tools/oracle) is not synced here: its lock is read by
  # the version test, and its model libraries are for the workstation.
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run --project tools pytest -q -p no:cacheprovider

  typescript:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: generated client is current
        run: pnpm gen:check
      - run: pnpm typecheck
      - run: pnpm test
      - name: desktop frontend builds
        run: pnpm build

  # The Rust workspace: the daemon's crates and the Tauri shell (ADR 0039). Clippy is
  # strict, every test runs, cargo-deny fails on a known vulnerability or a license outside
  # deny.toml's allowlist, and the control API's document is checked against the Rust types.
  # Two builds and no more: one dev build serves clippy, the tests and the export; one
  # release build makes the daemon, the two app binaries and the shell for the bundle.
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev clang libclang-dev lld \
            libpipewire-0.3-dev libspa-0.2-dev libpulse-dev libasound2-dev \
            libespeak-ng-dev libopus-dev
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo fmt --all --check
      # generate_context! wants the frontend's folder to exist; its contents don't matter to a check.
      - run: mkdir -p apps/desktop/dist
      - run: cargo clippy --workspace --locked --all-targets -- -D warnings
      # ONNX Runtime 1.24.4 into the cache (W10 of #39): `ort` loads it at run time, so
      # every test that opens a session needs it there (today those are the parity tests
      # and the model probes, ignored without fixtures; a new one must not fail for the
      # library's absence). The bundle below carries the same file.
      - run: scripts/onnxruntime.sh
      - run: cargo nextest run --workspace --locked
      # The contract the TypeScript client is generated from is the Rust types' document.
      - name: openapi.json is current
        run: cargo run -q -p ghost-api --bin ghost-api-export --locked | diff -u packages/api/openapi.json -
      - uses: EmbarkStudios/cargo-deny-action@v2
        with: { command: check }
      # The bundle (ADR 0038): the daemon and the app's two binaries in release, then one
      # .deb and one AppImage with them inside, proven on every push.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: the bundle
        run: pnpm tauri build --ci
      - name: the bundle carries the daemon, the app binaries and ONNX Runtime
        run: |
          ls -la target/release/bundle/deb/*.deb target/release/bundle/appimage/*.AppImage
          for b in ghostd ghost-mock-github ghost-scripts heka-ghost-desktop; do
            dpkg-deb -c target/release/bundle/deb/*.deb | grep -q "usr/bin/$b\$" || { echo "missing: $b"; exit 1; }
          done
          dpkg-deb -c target/release/bundle/deb/*.deb \
            | grep -q "usr/lib/heka-ghost-desktop/onnxruntime/libonnxruntime.so.1.24.4\$" \
            || { echo "missing: libonnxruntime.so.1.24.4"; exit 1; }

  # The one check main's ruleset requires, so adding or renaming a job above needs no
  # settings change.
  ci-ok:
    if: always()
    needs: [python, typescript, rust]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: every job passed
        run: |
          echo '${{ toJSON(needs) }}' | jq -e 'all(.[]; .result == "success")'
