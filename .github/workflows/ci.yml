name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a PR replaces its run; runs on main always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --all-packages --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q -p no:cacheprovider
      - name: openapi.json is current
        run: uv run python -m ghost_api.export | diff -u packages/api/openapi.json -
      # The .debs are built only on a release; at least the files they copy must exist.
      - name: every file the packages copy exists
        run: |
          grep -o '"\$ROOT/[^"]*"' packaging/build-debs.sh | tr -d '"' | sed 's#^\$ROOT/##' \
            | grep -v '^dist/\|^apps/desktop/src-tauri/target/' | sort -u \
            | while read -r f; do [ -e "$f" ] || { echo "missing: $f"; exit 1; }; done

  typescript:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: generated client is current
        run: pnpm gen:check
      - run: pnpm typecheck
      - run: pnpm test
      - name: desktop frontend builds
        run: pnpm build

  # The Rust workspace: the daemon's crates and the Tauri shell (ADR 0039). Clippy is
  # strict, every test runs, and cargo-deny fails on a known vulnerability or a license
  # outside deny.toml's allowlist.
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev clang libclang-dev lld \
            libpipewire-0.3-dev libspa-0.2-dev libpulse-dev libasound2-dev \
            libespeak-ng-dev libopus-dev
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo fmt --all --check
      # generate_context! wants the frontend's folder to exist; its contents don't matter to a check.
      - run: mkdir -p apps/desktop/dist
      - run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - run: cargo nextest run --workspace --locked
      - uses: EmbarkStudios/cargo-deny-action@v2
        with: { command: check }
      # The bundle (ADR 0038): the daemon and the app's two binaries in release, then one
      # .deb and one AppImage with them inside, proven on every push.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: the bundle
        run: pnpm tauri build --ci
      - name: the bundle carries the daemon and the app binaries
        run: |
          ls -la target/release/bundle/deb/*.deb target/release/bundle/appimage/*.AppImage
          for b in ghostd ghost-mock-github ghost-scripts heka-ghost-desktop; do
            dpkg-deb -c target/release/bundle/deb/*.deb | grep -q "usr/bin/$b\$" || { echo "missing: $b"; exit 1; }
          done

  # The one check main's ruleset requires, so adding or renaming a job above needs no
  # settings change.
  ci-ok:
    if: always()
    needs: [python, typescript, rust]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: every job passed
        run: |
          echo '${{ toJSON(needs) }}' | jq -e 'all(.[]; .result == "success")'
